[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "torchmplc"
version = "0.1.0"
description = "Tools for multi-plane light conversion simulations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "numpy",
    "matplotlib",
    "ipython",
]

[project.optional-dependencies]
sic = ["qbism"]
validation = ["psutil"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mplc*"]
